name: Refresh stock scan
on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC on weekdays, after the US close
  workflow_dispatch:
    inputs:
      params:
        description: "Scan settings as JSON. Leave empty to reuse the last saved settings."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run build_data.py
        env:
          PARAMS: ${{ github.event.inputs.params }}
        run: python build_data.py
      - name: Commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data.json params.json
          git diff --cached --quiet || git commit -m "Update scan results"
          git push
