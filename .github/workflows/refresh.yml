name: Refresh stock scan
on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC on weekdays, after the US close
  workflow_dispatch:
    inputs:
      params:
        description: "Scan settings as JSON. Leave empty to reuse the last saved settings."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run build_data.py
        env:
          PARAMS: ${{ github.event.inputs.params }}
        run: python build_data.py
      - name: Commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data.json
          if [ -f params.json ]; then git add params.json; fi
          if git diff --cached --quiet; then echo "Nothing changed, nothing to commit"; exit 0; fi
          git commit -m "Update scan results"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
